<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 - Sayfa Bulunamadı | Deucritic</title>
  <style>
    body{
      margin:0;
      font-family:Inter, system-ui, sans-serif;
      background:#030712;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#e5ecf7;
    }
    .wrap{
      text-align:center;
      padding:40px 28px;
      max-width:520px;
      width:92%;
      background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0.02));
      border-radius:22px;
      backdrop-filter:blur(8px);
      box-shadow:0 0 40px rgba(0,0,0,0.45);
    }
    .logo{
      width:70px;
      margin-bottom:14px;
      filter:drop-shadow(0 0 6px rgba(6,182,212,0.4));
    }
    h1{
      font-size:72px;
      margin:0;
      font-weight:800;
      background:linear-gradient(90deg,#06b6d4,#67e8f9);
      -webkit-background-clip:text;
      color:transparent;
    }
    p{
      margin-top:16px;
      color:#9da9ba;
      font-size:16px;
      line-height:1.6;
    }
    a{
      display:inline-block;
      margin-top:22px;
      padding:12px 22px;
      background:#06b6d4;
      border-radius:14px;
      color:#031015;
      font-weight:600;
      text-decoration:none;
      transition:0.2s;
    }
    a:hover{
      transform:translateY(-3px) scale(1.04);
      box-shadow:0 0 12px rgba(6,182,212,0.65);
    }
    .glow{
      position:absolute;
      width:400px;
      height:400px;
      background:radial-gradient(circle,#0ea5e9 0%,rgba(14,165,233,0) 70%);
      opacity:0.07;
      border-radius:50%;
      filter:blur(80px);
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      z-index:-1;
    }
  </style>
    <link rel="stylesheet" href="/css/brand.css">
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <img src="/gorsel/deucritic-mark.svg" alt="Deucritic Logo" class="logo" />
    <h1>404</h1>
 <p>Bu sayfa çayı demlemeye gitti. <br>Gelir mi bilemeyiz. Ya silindi ya da hiç var olmamış gibi davranıyor.</p>
<a href="/">Ana Sayfaya Dön</a>
  </div>
</body>
</html>
